<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tegrafik México — 276 cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfd; --card:#fff; --ink:#1d1d1f; --ink2:#585860; --ink3:#6b6b70;
  --line:#e8e8ed; --hair:#c9c9ce; --blue:#0067d1; --amber:#8a5100; --green:#1a7f37; --red:#b3261e;
  --f:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.47;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px 120px}

header{padding:44px 0 30px;text-align:center}
.logos{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:0 0 26px}
.logos .ff{width:148px;height:auto;justify-self:start}
.logos .client{width:150px;height:auto;justify-self:center}
.eyebrow{font-size:13px;font-weight:500;color:var(--ink3);margin:0 0 10px}
h1{font-size:clamp(32px,4.4vw,50px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:0}
.sub{font-size:clamp(16px,1.8vw,19px);color:var(--ink2);letter-spacing:-.01em;margin:12px auto 0;max-width:56ch}
.hstats{display:flex;justify-content:center;gap:clamp(30px,6vw,64px);margin-top:28px;flex-wrap:wrap}
.hstat b{display:block;font-size:clamp(28px,3.6vw,38px);font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.hstat span{display:block;font-size:13px;color:var(--ink2);margin-top:7px}

.secttl{font-size:14px;font-weight:600;color:var(--ink2);margin:0 0 12px;padding:0 4px}

/* map */
.maphost{position:relative}
.mapwrap{background:var(--card);border-radius:14px;padding:18px 22px 14px;box-shadow:0 1px 3px rgba(0,0,0,.045);margin:0 0 10px}
.maphead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin:0 0 6px}
.maphead h2{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
.maphead .sub{font-size:12.5px;color:var(--ink3);margin:3px 0 0;max-width:none}
.metric{display:flex;gap:4px;padding:4px;background:#efeff4;border-radius:11px}
.metric button{background:none;border:0;font:inherit;font-size:14px;font-weight:500;letter-spacing:-.008em;color:var(--ink2);padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease}
.metric button:hover{color:var(--ink)}
.metric button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mapwrap svg{width:100%;height:auto;display:block;max-height:52vh;stroke:#fff;stroke-width:.8}
.mapwrap .st-shape{stroke:var(--card);stroke-width:1;cursor:pointer;transition:fill .3s cubic-bezier(.28,.11,.32,1),opacity .18s ease}
.mapwrap .st-shape:hover{opacity:.78}
.mapwrap .st-shape.sel{stroke:var(--ink);stroke-width:2}
.mapwrap .brd{fill:none;stroke:var(--card);stroke-width:.9;pointer-events:none}
.mapwrap .inset{fill:none;stroke:var(--hair);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.maplab{font-size:10px;fill:#fff;font-weight:600;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2.4px;stroke-linejoin:round;font-family:var(--f)}
.maplab.dark{fill:var(--ink2);stroke:var(--card);stroke-width:3px}
.mapfoot{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:6px}
.legend{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink3)}
.legend .swatches{display:flex} .legend i{width:34px;height:11px;display:block}
.legend i:first-of-type{border-radius:3px 0 0 3px} .legend i:last-of-type{border-radius:0 3px 3px 0}
.mapnote{font-size:13px;color:var(--ink3);margin:0;max-width:74ch}
.maptip{position:absolute;pointer-events:none;background:rgba(29,29,31,.94);color:#fff;padding:8px 11px;border-radius:9px;font-size:13px;line-height:1.4;white-space:nowrap;transform:translate(-50%,-118%);opacity:0;transition:opacity .12s ease;z-index:5}
.maptip b{font-weight:600}

/* filter bar */
.rangebox{background:var(--card);border-radius:14px;padding:13px 18px;box-shadow:0 1px 3px rgba(0,0,0,.045);margin:30px 0 10px}
.rangetop{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.rangetop .searchwrap{flex:1 1 200px;min-width:180px}
.searchwrap{position:relative}
.searchwrap svg.mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.searchwrap input{width:100%;font:inherit;font-size:15px;letter-spacing:-.01em;padding:9px 64px 9px 38px;border-radius:12px;border:1px solid #e0e0e5;background:var(--card);color:var(--ink);-webkit-appearance:none;transition:border-color .18s ease,box-shadow .18s ease}
.searchwrap input::placeholder{color:#8b8b90}
.searchwrap input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.16)}
.searchwrap input::-webkit-search-cancel-button{-webkit-appearance:none}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer;padding:7px 11px;border-radius:9px}
.qclear:hover{background:#f0f0f4;color:var(--ink)} .qclear[hidden]{display:none}
.presets{display:flex;gap:4px;padding:4px;background:#efeff4;border-radius:11px}
.presets button{background:none;border:0;font:inherit;font-size:14px;font-weight:500;letter-spacing:-.008em;color:var(--ink2);padding:6px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease}
.presets button:hover{color:var(--ink)}
.presets button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* table */
.tablehead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:22px 0 12px;padding:0 4px}
.tablehead h3{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
.tablehead .m{font-size:13.5px;color:var(--ink2);margin:2px 0 0}
.stclose{background:none;border:0;font:inherit;font-size:13.5px;color:var(--blue);cursor:pointer;padding:0}
.stclose:hover{opacity:.72} .stclose[hidden]{display:none}
.ranklist{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.045)}
.bhead,.brow{display:grid;grid-template-columns:30px minmax(150px,1.4fr) 150px 96px 120px 160px;align-items:center;gap:16px;padding:12px 24px}
.bhead{font-size:13.5px;color:var(--ink3);border-bottom:1px solid var(--line);padding-top:15px;padding-bottom:13px}
.bhead .r{text-align:right}
.sortbtn{background:none;border:0;font:inherit;font-size:13.5px;color:inherit;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}
.sortbtn:hover{color:var(--blue)} .sortbtn .ar{color:var(--blue);font-weight:600}
.brow{border-bottom:1px solid var(--line);transition:background .16s ease}
.brow:last-child{border-bottom:0} .brow:hover{background:#f5f5f7}
.brow:has(.cnt[aria-expanded="true"]){background:#f5f5f7}
.brow .pl{font-size:14px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.brow .st{font-size:16px;font-weight:500;letter-spacing:-.012em;line-height:1.25}
.brow .st .sub{display:block;font-size:12.5px;color:var(--ink2);font-weight:400;margin-top:2px}
.brow .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.brow .r.dim{color:var(--ink3)}
.brow .prov{font-size:15px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .prov.none{color:var(--ink3);font-size:13.5px}
.brow.out .st,.brow.out .r,.brow.out .prov{color:var(--ink3)}
.brow.out .st{font-weight:400}
.cnt{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--blue);background:#eef4fc;border:0;border-radius:9px;padding:5px 10px 5px 12px;cursor:pointer;transition:background .16s ease}
.cnt:hover{background:#dfe9f9} .cnt svg{color:var(--blue);transition:transform .28s cubic-bezier(.28,.11,.32,1)}
.cnt[aria-expanded="true"]{background:var(--blue);color:#fff} .cnt[aria-expanded="true"] svg{transform:rotate(90deg);color:#fff}
.cnt.none{background:none;color:#c2c2c8;padding-left:12px;cursor:default}
.badge{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.connected{background:#e6f0fb;color:var(--blue)} .badge.pending{background:#eef2f7;color:#3d5a80}
.badge.noli{background:#f0f0f3;color:var(--ink3)} .badge.client{background:#e6f4ea;color:var(--green)} .badge.small{background:#fbeceb;color:var(--red)}
.people{padding:4px 24px 16px 70px;border-bottom:1px solid var(--line);background:#f5f5f7}
.people[hidden]{display:none}
.phead,.person{display:grid;grid-template-columns:minmax(170px,1.1fr) 1fr minmax(200px,1.3fr);gap:14px;align-items:baseline;padding:8px 0}
.phead{font-size:12.5px;color:var(--ink3);border-bottom:1px solid #e2e2e7}
.person{border-bottom:1px solid #e9e9ee;font-size:13.5px;color:var(--ink2)} .person:last-child{border-bottom:0}
.person .pn{font-size:14.5px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.person a{color:var(--blue);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person a:hover{text-decoration:underline}
.person.warn .pn{color:var(--amber)}
.person .flag{display:block;font-size:12px;font-weight:400;color:var(--amber);margin-top:1px;white-space:normal}
.empty{padding:18px 24px;font-size:14px;color:var(--ink3)}

.note{margin-top:34px;background:var(--card);border-radius:14px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.045);font-size:13.5px;color:var(--ink2);max-width:80ch}
.note p{margin:0 0 10px} .note p:last-child{margin:0} .note b{color:var(--ink);font-weight:600}
footer{text-align:center;padding-top:40px} footer .fmark{display:block;width:118px;height:auto;margin:0 auto;opacity:.72}
@media (max-width:760px){
  .logos{grid-template-columns:1fr;justify-items:center} .logos .ff{justify-self:center;width:130px}
  .bhead{display:none} .brow{grid-template-columns:26px 1fr 70px 80px;gap:10px;padding:12px 16px}
  .brow .prov,.brow .r{display:none}
  .people{padding-left:16px} .phead{display:none} .person{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){ .mapwrap .st-shape,.cnt svg{transition:none} }

/* nav */
.nav{display:flex;gap:4px;padding:4px;background:#efeff4;border-radius:12px;width:max-content;margin:0 auto 30px}
.nav button{background:none;border:0;font:inherit;font-size:15px;font-weight:500;color:var(--ink2);padding:8px 18px;border-radius:9px;cursor:pointer}
.nav button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.page[hidden]{display:none}
/* competitor panel */
.comp{background:var(--card);border-radius:14px;padding:18px 22px 14px;box-shadow:0 1px 3px rgba(0,0,0,.045);margin:0 0 34px}
.comphead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.comphead h2{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
.comphead p{font-size:12.5px;color:var(--ink3);margin:0}
.brandlist{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 28px}
.brand{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:12px;padding:7px 6px;border:0;background:none;font:inherit;text-align:left;cursor:pointer;border-radius:8px;color:var(--ink)}
.brand:hover{background:#f5f5f7}
.brand[aria-pressed="true"]{background:#eef4fc}
.brand .bn{font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bb{height:9px;border-radius:5px;background:#e8e8ed;overflow:hidden}
.brand .bb i{display:block;height:9px;background:var(--blue);border-radius:5px}
.brand[aria-pressed="true"] .bb i{background:var(--ink)}
.brand .bc{font-size:13.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.brand.avila .bb i{background:#e0a100}
.compfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3)}
.compfoot button{font:inherit;font-size:13px;font-weight:500;color:var(--ink2);background:#efeff4;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.compfoot button[aria-pressed="true"]{background:var(--blue);color:#fff}
/* table extras */
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:6px;background:#f0f0f3;color:var(--ink2);margin:2px 3px 0 0;white-space:nowrap}
.chip.hit{background:#eef4fc;color:var(--blue)}
.chip.avila{background:#fff4d6;color:#7a5200}
.pbadge{display:inline-block;font-size:12px;font-weight:600;width:22px;height:22px;line-height:22px;border-radius:6px;text-align:center}
.pbadge.p1{background:var(--blue);color:#fff} .pbadge.p2{background:#b6d3f2;color:var(--ink)} .pbadge.p3{background:#e8e8ed;color:var(--ink2)}
.rowbtn{background:none;border:0;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.rowbtn svg{color:var(--hair);flex-shrink:0;transition:transform .28s cubic-bezier(.28,.11,.32,1)}
.rowbtn[aria-expanded="true"] svg{transform:rotate(90deg);color:var(--blue)}
.detail{padding:6px 24px 16px 70px;border-bottom:1px solid var(--line);background:#f5f5f7;font-size:13.5px;color:var(--ink2);line-height:1.5}
.detail[hidden]{display:none}
.detail a{color:var(--blue);text-decoration:none} .detail a:hover{text-decoration:underline}
.detail .links{margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
.detail.comps{padding-top:10px;padding-bottom:12px} .detail.comps .lbl{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px} .detail.comps .chip{font-size:13px;padding:4px 10px}
.yn{display:inline-block;font-size:13px;font-weight:600;width:28px;height:24px;line-height:24px;border-radius:6px;text-align:center;background:#f0f0f3;color:var(--ink3)} .yn.y{background:#eef4fc;color:var(--blue)}
/* shows table */
.shead,.srow{display:grid;grid-template-columns:30px minmax(180px,1.5fr) 100px 90px minmax(160px,1.2fr);align-items:center;gap:14px;padding:12px 24px}
.shead{font-size:13.5px;color:var(--ink3);border-bottom:1px solid var(--line)}
.srow{border-bottom:1px solid var(--line);font-size:14.5px} .srow:last-child{border-bottom:0} .srow:hover{background:#f5f5f7}
.srow .r{text-align:right;font-variant-numeric:tabular-nums}
.srow .nm{font-size:15.5px;font-weight:500;letter-spacing:-.01em;line-height:1.25}
.srow .nm .sub{display:block;font-size:12.5px;color:var(--ink2);font-weight:400;margin-top:2px}
.srow .ct{font-size:13.5px;line-height:1.35} .srow .ct .role{display:block;color:var(--ink3);font-size:12.5px}
.srow a{color:var(--blue);text-decoration:none;font-size:13px} .srow a:hover{text-decoration:underline}
.tierbadge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef4fc;color:var(--blue)}
@media (max-width:900px){ .brandlist{grid-template-columns:1fr} .shead{display:none} .srow{grid-template-columns:26px 1fr;gap:6px 10px} }
.slider{padding:16px 4px 0}
.slider input{width:100%;margin:0;accent-color:var(--blue);cursor:pointer}
.ticks{display:grid;grid-template-columns:repeat(5,1fr);font-size:12.5px;color:var(--ink3);margin-top:4px}
.ticks span{text-align:center} .ticks span:first-child{text-align:left} .ticks span:last-child{text-align:right}
.ticks span.on{color:var(--ink);font-weight:600}
.badge{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.connected{background:#e6f0fb;color:var(--blue)} .badge.pending{background:#eef2f7;color:#3d5a80}
.badge.noli{background:#f0f0f3;color:var(--ink3)} .badge.client{background:#e6f4ea;color:var(--green)} .badge.small{background:#fbeceb;color:var(--red)}
.people{padding:4px 24px 16px 70px;border-bottom:1px solid var(--line);background:#f5f5f7}
.people[hidden]{display:none}
.phead,.person{display:grid;grid-template-columns:minmax(170px,1.1fr) 1fr minmax(200px,1.3fr);gap:14px;align-items:baseline;padding:8px 0}
.phead{font-size:12.5px;color:var(--ink3);border-bottom:1px solid #e2e2e7}
.person{border-bottom:1px solid #e9e9ee;font-size:13.5px;color:var(--ink2)} .person:last-child{border-bottom:0}
.person .pn{font-size:14.5px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.person a{color:var(--blue);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person a:hover{text-decoration:underline}
.person.warn .pn{color:var(--amber)}
.person .flag{display:block;font-size:12px;font-weight:400;color:var(--amber);margin-top:1px;white-space:normal}
.brow.out .st,.brow.out .r,.brow.out .prov{color:var(--ink3)}
.brow.out .st{font-weight:400}
.badge.new{background:#eef4fc;color:var(--blue)}
.dual{position:relative;height:28px;margin:18px 4px 0}
.dual .track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:#e0e0e5}
.dual .fill{position:absolute;top:0;height:4px;border-radius:2px;background:var(--blue)}
.dual input{position:absolute;left:0;right:0;top:0;width:100%;margin:0;-webkit-appearance:none;appearance:none;background:none;pointer-events:none;height:28px}
.dual input::-webkit-slider-runnable-track{background:none;height:28px}
.dual input::-moz-range-track{background:none;height:28px}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #c9c9ce;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer;margin-top:3px}
.dual input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #c9c9ce;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer}
.ticks.six{grid-template-columns:repeat(7,1fr);margin:6px 4px 0}
.ticks.six span{text-align:center} .ticks.six span:first-child{text-align:left} .ticks.six span:last-child{text-align:right}
.rangesum{margin:10px 4px 0;font-size:15px;color:var(--ink2)} .rangesum b{color:var(--ink);font-weight:600}
.logos .client{width:112px;height:auto;justify-self:center;align-self:center}
.idn{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding-left:12px} .idn.none{color:#c2c2c8;font-weight:500}
.newtag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:#e6f4ea;color:#1a7f37;margin-left:8px;vertical-align:middle}
</style>

function drawBrands(){ return;
  const counts = D.brands.map(b => [b, D.rows.filter(r=>r.brands.includes(b)).length]).sort((a,b)=>b[1]-a[1]);
  const max = counts[0][1] || 1;
  document.getElementById('brandlist').innerHTML = counts.map(([b,n]) =>
    '<button class="brand" data-b="'+b+'" aria-pressed="'+(brand===b)+'"><span class="bn">'+b+'</span><span class="bb"><i style="width:'+(100*n/max)+'%"></i></span><span class="bc">'+n+'</span></button>').join('')
    + '<button class="brand avila" data-b="__avila" aria-pressed="'+(brand==='__avila')+'"><span class="bn">Ávila Dos</span><span class="bb"><i style="width:'+(100*11/max)+'%"></i></span><span class="bc">11</span></button>';
  document.querySelectorAll('#brandlist .brand').forEach(el => el.addEventListener('click', () => setBrand(el.dataset.b)));
  document.querySelectorAll('.compfoot button').forEach(el => el.setAttribute('aria-pressed', brand===el.dataset.b));
}
function setBrand(b){ brand = brand===b ? null : b; selected=null; openCo=null; drawBrands(); drawMap(); drawGrid(); }
// avila pseudo-brand
const _pb = passBrand;
const passBrand2 = r => brand==='__avila' ? r.avila : _pb(r);

function aggregate(pool){
  const by = {};
  pool.forEach(r => { if(!r.prov) return;
    const a = by[r.prov] || (by[r.prov] = {n:0, p1:0, comp:0, rev:0, rows:[]});
    a.n++; if(r.prio===1) a.p1++; if(r.nb>0) a.comp++; a.rev += (r.rev||0); a.rows.push(r); });
  return by;
}
const passViso = r => viso==='all' ? true : viso==='y' ? r.brands.includes('Visobath') : !r.brands.includes('Visobath');
function pool(){ return D.rows.filter(r => passBrand2(r) && passViso(r) && (!sector || r.sector===sector) && (r.rev||0) >= minRev && (maxRev===Infinity || (r.rev||0) < maxRev)); }
const eur = v => v==null ? '—' : v>=1000 ? (v/1000).toFixed(1).replace('.',',')+' B$' : (v>=10 ? Math.round(v) : v.toFixed(1).replace('.',','))+' M$';

function drawMap(){
  const p = pool(), by = aggregate(p);
  const vals = Object.values(by).map(a=>a[metric]).filter(v=>v>0).sort((a,b)=>a-b);
  const max = vals[vals.length-1] || 1;
  const cuts = [1,.2,.4,.6,.8].map((f,i)=> i? Math.ceil(max*f) : 1).map((v,i,arr)=>Math.max(v, arr[i-1]||0));
  const bucket = v => { let i=0; while(i<cuts.length && v>cuts[i]) i++; return i; };
  const fill = pv => (by[pv] && by[pv][metric]>0) ? RAMP[bucket(by[pv][metric])] : '#eff0f3';
  const g = D.geo;
  let s = '<svg viewBox="'+g.viewBox+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa de México por estado">';
  g.provs.forEach(pr => { s += '<path class="st-shape'+(selected===pr.name?' sel':'')+'" data-p="'+pr.name.replace(/"/g,'&quot;')+'" d="'+pr.d+'" fill="'+fill(pr.name)+'"/>'; });
    s += '</svg>';
  document.getElementById('map').innerHTML = s;
  const svgEl = document.querySelector('#map svg');
  g.provs.forEach(pr => { const a = by[pr.name]; if(!a || a[metric]===0) return;
    const el = svgEl.querySelector('[data-p="'+pr.name.replace(/"/g,'\\"')+'"]'); if(!el) return; const bb = el.getBBox();
    const t = document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('class','maplab'+(bucket(a[metric])<2?' dark':''));
    t.setAttribute('x', bb.x+bb.width/2); t.setAttribute('y', bb.y+bb.height/2+4); t.textContent = (metric==='rev'?fmtEur(a.rev):a[metric]); svgEl.appendChild(t); });
  document.getElementById('swatches').innerHTML = RAMP.map(c=>'<i style="background:'+c+'"></i>').join('');
  const lbl = brand==='__any'?'showing any competitor':brand==='__none'?'with no brands seen':brand==='__multi'?'showing 3+ brands':brand==='__avila'?'already showing Ávila Dos':brand?'showing '+brand:'';
  document.getElementById('mapsub').textContent = p.length+' cuentas · pulsa un estado para filtrar la tabla';
  const un = p.filter(r=>!r.prov).length;
  document.getElementById('mapnote').textContent = 'Estado de la sede.'+(un?' '+un+' de esta vista no tienen estado y no aparecen en el mapa.':'');
  const tip = document.getElementById('maptip'), host = document.getElementById('maphost');
  document.querySelectorAll('#map .st-shape').forEach(el => {
    el.addEventListener('mousemove', e => {
      const pv = el.dataset.p, a = by[pv];
      tip.innerHTML = '<b>'+disp(pv)+'</b>' + (a
        ? '<br>'+a.n+(a.n===1?' cuenta':' cuentas')+' · '+fmtEur(a.rev)
        + '<br><span style="opacity:.75">'+a.rows.map(r=>r.name).slice(0,5).join(', ')+(a.rows.length>5?' +'+(a.rows.length-5)+' más':'')+'</span>'
        : '<br><span style="opacity:.75">Sin cuentas en esta vista</span>');
      const rc = host.getBoundingClientRect();
      tip.style.left = (e.clientX - rc.left)+'px'; tip.style.top = (e.clientY - rc.top)+'px'; tip.style.opacity = 1;
    });
    el.addEventListener('mouseleave', () => tip.style.opacity = 0);
    el.addEventListener('click', () => { const pv = el.dataset.p; selected = (selected===pv) ? null : (by[pv] ? pv : null); drawMap(); drawGrid(); });
  });
}

function drawGrid(){
  const rank = {}; D.rows.slice().sort((a,b)=>(b.rev||0)-(a.rev||0) || b.nb-a.nb || b.conn-a.conn || a.name.localeCompare(b.name)).forEach((r,i)=>rank[r.name]=i+1);
  let p = pool();
  if(selected) p = p.filter(r=>r.prov===selected);
  if(q) p = p.filter(r => [r.name, r.city, r.prov||'', r.sector].join(' ').toLowerCase().includes(q));
  p.sort((a,b) => {
    const key = k => x => k==='name' ? x.name : k==='prov' ? (x.prov?disp(x.prov):'zzz') : k==='viso' ? (x.brands.includes('Visobath')?1:0) : k==='rev' ? (x.rev ?? -1) : k==='status' ? SORD.indexOf(x.status) : x[k];
    const va = key(sortKey)(a), vb = key(sortKey)(b);
    const cmp = typeof va==='string' ? va.localeCompare(vb) : va-vb;
    return cmp*sortDir || rank[a.name]-rank[b.name];
  });
  document.getElementById('gridttl').textContent = q ? p.length+(p.length===1?' coincidencia':' coincidencias') : (selected ? disp(selected) : 'Todas las cuentas');
  document.getElementById('gridsub').textContent = p.length+(p.length===1?' cuenta':' cuentas')+' · '+p.reduce((t,r)=>t+r.conn,0)+' personas conectadas';
  document.getElementById('stclose').hidden = !selected;
  document.getElementById('qclear').hidden = !q;
  const arrow = k => sortKey===k ? '<span class="ar">'+(sortDir<0?'↓':'↑')+'</span>' : '';
  document.getElementById('grid').innerHTML = !p.length
    ? '<p class="empty">Ninguna cuenta coincide. Quita el filtro de facturación o de estado.</p>'
    : '<div class="bhead" style="grid-template-columns:30px minmax(170px,1.4fr) 140px 100px 140px 150px"><span></span>'
    + '<span><button class="sortbtn" data-sort="name">Empresa'+arrow('name')+'</button></span>'
    + '<span><button class="sortbtn" data-sort="conn">Personas conectadas'+arrow('conn')+'</button></span>'
    + '<span class="r"><button class="sortbtn" data-sort="rev">Facturación'+arrow('rev')+'</button></span>'
    + '<span><button class="sortbtn" data-sort="prov">Estado'+arrow('prov')+'</button></span>'
    + '<span><button class="sortbtn" data-sort="status">Etapa'+arrow('status')+'</button></span></div>'
    + p.map(r => {
      const open = openCo===r.name;
      const SEC={'Automotive parts':'Autopartes','Electronics':'Electrónica','Other sectors':'Otros sectores'};
      const sub = [r.city, SEC[r.sector]||r.sector, r.staff ? r.staff.toLocaleString('es')+' empleados' : null].filter(Boolean).join(' · ');
      const comps = r.brands.filter(b=>b!=='Ávila Dos');
      const notes = r.notes ? r.notes.replace(/^A[0-9] — [^·]*·[ ]*/,"").replace(/UNCHECKED · /,"").replace(/ · facturaci[oó]n:[^·]*/,"").replace(/ · \d+(?:[.,]\d+)? M€/,"").replace(/ · /g,"<br>") : "Sin notas.";
      const openP = openPeople===r.name && r.conn>0;
      const ppl = !r.conn ? '' : '<div class="people"'+(openP?'':' hidden')+'><div class="phead"><span>Nombre</span><span>Cargo</span><span>LinkedIn</span></div>'
        + r.people.map(x => '<div class="person'+(/pending|wrong/.test(x.via)?' warn':'')+'"><span class="pn">'+x.n+(x.isnew?'<span class="newtag">Nuevo</span>':'')+'</span><span>'+x.func+'</span><a href="'+x.li+'" target="_blank" rel="noopener">'+x.li.replace('https://www.','')+'</a></div>').join('')+'</div>';
      return '<div class="brow'+(['connected','pending','new'].includes(r.status)?'':' out')+'" style="grid-template-columns:30px minmax(170px,1.4fr) 140px 100px 140px 150px">'
        + '<span class="pl">'+rank[r.name]+'</span>'
        + '<span class="st"><button class="rowbtn" data-co="'+r.name.replace(/"/g,'&quot;')+'" aria-expanded="'+open+'">'+CHEV+'<span>'+r.name+(sub?'<span class="sub">'+sub+'</span>':'')+'</span></button></span>'
        + '<span>'+(r.conn ? '<button class="cnt" data-pp="'+r.name.replace(/"/g,'&quot;')+'" aria-expanded="'+openP+'">'+r.conn+CHEV+'</button>'+(r.isnew?'<span class="newtag">Nuevo</span>':'') : '<span class="cnt none">0</span>')+'</span>'
        + '<span class="r'+(r.rev==null?' dim':'')+'">'+eur(r.rev)+''+'</span>'
        + '<span class="prov'+(r.prov?'':' none')+'">'+(r.prov?disp(r.prov):'—')+'</span>'
        + '<span><span class="badge '+r.status+'">'+SLAB[r.status]+'</span>'+(r.avila?' <span class="chip avila">Ávila Dos</span>':'')+'</span>'
        + '</div>' + ppl
        + '<div class="detail"'+(open?'':' hidden')+'>'+notes+'<div class="links">'+(r.web?'<a href="'+r.web+'" target="_blank" rel="noopener">Web</a>':'')+(r.li?'<a href="'+r.li+'" target="_blank" rel="noopener">LinkedIn</a>':'')+'</div></div>';
    }).join('');
  document.querySelectorAll('#grid .rowbtn').forEach(b => b.addEventListener('click', () => { openCo = openCo===b.dataset.co ? null : b.dataset.co; drawGrid(); }));
  document.querySelectorAll('#grid .cnt[data-cc]').forEach(b => b.addEventListener('click', () => { openComp = openComp===b.dataset.cc ? null : b.dataset.cc; drawGrid(); }));
  document.querySelectorAll('#grid .cnt[data-pp]').forEach(b => b.addEventListener('click', () => { openPeople = openPeople===b.dataset.pp ? null : b.dataset.pp; drawGrid(); }));
  document.querySelectorAll('#grid .sortbtn').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sort; if(sortKey===k) sortDir = -sortDir; else { sortKey = k; sortDir = (k==='nb'||k==='conn'||k==='rev'||k==='ident') ? -1 : 1; } drawGrid(); }));
}

function drawShows(){
  const eur = v => '€'+(v/1e6).toFixed(1)+'M';
  const rows = D.shows.slice().sort((a,b)=>b.sales-a.sales);
  document.getElementById('showsgrid').innerHTML = '<div class="shead"><span></span><span>Company</span><span class="r">Sales</span><span class="r">Employees</span><span>Competitor brands on site</span></div>'
    + rows.map((r,i) => '<div class="srow"><span class="pl">'+(i+1)+'</span>'
      + '<span class="nm">'+r.name+'<span class="sub">'+(r.prov?disp(r.prov):'—')+' · <a href="'+r.where+'" target="_blank" rel="noopener">where it appears</a>'+(r.li?' · <a href="'+r.li+'" target="_blank" rel="noopener">LinkedIn</a>':'')+'</span></span>'
      + '<span class="r">'+eur(r.sales)+'</span><span class="r">'+r.emp+'</span>'
      + '<span>'+(r.brands.length ? r.brands.map(b=>'<span class="chip">'+b+'</span>').join('') : '<span style="color:var(--ink3);font-size:12.5px">none seen</span>')+'</span>'
      + '</div>').join('');
}


document.getElementById('metric').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; metric = b.dataset.m;
  document.querySelectorAll('#metric button').forEach(x => x.setAttribute('aria-pressed', x===b)); drawMap(); });
const STEPS=[0,25,50,100,500,1000,Infinity]; const TICK=['Cualquiera','25 M$','50 M$','100 M$','500 M$','1 B$','Sin límite'];
let loI=0, hiI=6;
function fmtEur(v){ return (v>=1000?(v/1000).toFixed(2).replace('.',',')+' B$':Math.round(v)+' M$'); }
function applyRange(){
  minRev = STEPS[loI]; maxRev = STEPS[hiI]; selected=null;
  document.getElementById('lo').value=loI; document.getElementById('hi').value=hiI;
  const f=document.getElementById('fill'); f.style.left=(loI/6*100)+'%'; f.style.width=((hiI-loI)/6*100)+'%';
  document.querySelectorAll('#presets button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.min===minRev && hiI===6));
  document.querySelectorAll('#revticks span').forEach((x,i) => x.classList.toggle('on', i===loI || i===hiI));
  drawMap(); drawGrid();
  const pl = pool(); const rev = pl.reduce((t,r)=>t+(r.rev||0),0);
  document.getElementById('rangesum').innerHTML = '<b>'+pl.length+' cuentas</b> · '+fmtEur(rev)+' de facturación'+((loI===0&&hiI===6)?' — toda la lista':' — de '+TICK[loI].toLowerCase()+' a '+(hiI===6?'sin límite':TICK[hiI]));
}
document.getElementById('revticks').innerHTML = TICK.map(t=>'<span>'+t+'</span>').join('');
document.getElementById('lo').addEventListener('input', e => { loI=Math.min(+e.target.value, hiI); applyRange(); });
document.getElementById('hi').addEventListener('input', e => { hiI=Math.max(+e.target.value, loI); applyRange(); });
function setRev(v){ loI=STEPS.indexOf(v); hiI=6; applyRange(); }
document.getElementById('presets').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; setRev(+b.dataset.min); return;
  document.querySelectorAll('#presets button').forEach(x => x.setAttribute('aria-pressed', x===b)); drawMap(); drawGrid(); });

document.getElementById('sect').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; sector = b.dataset.s; selected=null;
  document.querySelectorAll('#sect button').forEach(x => x.setAttribute('aria-pressed', x===b)); applyRange(); });
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); drawGrid(); });
document.getElementById('qclear').addEventListener('click', () => { const i=document.getElementById('q'); i.value=''; q=''; drawGrid(); i.focus(); });
document.getElementById('stclose').addEventListener('click', () => { selected = null; drawMap(); drawGrid(); });
applyRange();
</script>
</html>
